        if (!points || points.length < 2) return null;
        let len = 0;
        let minY = 9999;
        for (let i = 1; i < points.length; i++) {
          len += Math.hypot(points[i][0] - points[i - 1][0], points[i][1] - points[i - 1][1]);
          if (points[i][1] < minY) minY = points[i][1];
        }
        totalContourLength += len;
        const p2d = new Path2D();
        p2d.moveTo(points[0][0], points[0][1]);
        for (let i = 1; i < points.length - 1; i++) {
          const xc = (points[i][0] + points[i + 1][0]) / 2;
          const yc = (points[i][1] + points[i + 1][1]) / 2;
          p2d.quadraticCurveTo(points[i][0], points[i][1], xc, yc);
        }
        p2d.lineTo(points[points.length - 1][0], points[points.length - 1][1]);
        const isMain = len >= 140;
        return { points, total: len, minY, path2d: p2d, isMain };

      // Helpers
      const clamp = n => Math.max(0, Math.min(1, n));
      const smooth = n => { const t = clamp(n); return t * t * (3 - 2 * t); };

      // Shooting stars data (horizontal/slanted realistic meteors)
      const METEORS = [
        { startT: 300,   dur: 950,  y: 160, x0: 1750, dx: -1250, dy: 130, color: '#38bdf8' },
        { startT: 900,   dur: 1050, y: 300, x0: 1850, dx: -1300, dy: 140, color: '#c084fc' },
        { startT: 1600,  dur: 950,  y: 130, x0: 1680, dx: -1200, dy: 120, color: '#f472b6' },
        { startT: 2300,  dur: 900,  y: 380, x0: 1900, dx: -1350, dy: 150, color: '#38bdf8' },
        { startT: 3100,  dur: 1000, y: 240, x0: 1720, dx: -1250, dy: 130, color: '#ffffff' },
        { startT: 4200,  dur: 950,  y: 190, x0: 1800, dx: -1200, dy: 120, color: '#38bdf8' },
        { startT: 5500,  dur: 1050, y: 340, x0: 1750, dx: -1250, dy: 140, color: '#c084fc' },
        { startT: 7200,  dur: 950,  y: 150, x0: 1700, dx: -1200, dy: 130, color: '#38bdf8' },
        { startT: 8800,  dur: 1000, y: 280, x0: 1820, dx: -1280, dy: 140, color: '#f472b6' },
        { startT: 10400, dur: 950,  y: 220, x0: 1760, dx: -1220, dy: 130, color: '#38bdf8' }

      // Render single frame
      async function drawFrame(t) {
        ctx.fillStyle = '#000000';
        ctx.fillRect(0, 0, 1920, 1080);

        // ----------------------------------------------------
        // 1. CHARACTER STAGE WITH CAMERA ZOOM & RADIAL MASK
        // ----------------------------------------------------
        let camScale = 1.0;
        let camTx = 0;
        let camTy = 0;

        if (t <= 3200) {
          camScale = 1.55;
          camTx = -1310 * (camScale - 1) + (1920 * (camScale - 1) * 0.28);
          camTy = -320 * (camScale - 1) + (1080 * (camScale - 1) * 0.12);
        } else if (t <= 7500) {
          const a = smooth((t - 3200) / 4300);
          camScale = 1.55 - 0.55 * a;
          const fullTx = -1310 * (1.55 - 1) + (1920 * (1.55 - 1) * 0.28);
          const fullTy = -320 * (1.55 - 1) + (1080 * (1.55 - 1) * 0.12);
          camTx = fullTx * (1 - a);
          camTy = fullTy * (1 - a);
        } else {
          camScale = 1.0;
          camTx = 0;
          camTy = 0;
        }

        ctx.save();
        ctx.translate(camTx, camTy);
        ctx.scale(camScale, camScale);

        // Draw character video or still image with radial mask in dark opening
        if (t < 3200) {
          // Closed-eyes still frame emerging softly from pitch black
          const progress = clamp(t / 3200);
          const imgAlpha = smooth(t / 2500) * 0.70; // Soft emergence
          const maskRadius = 120 + 320 * smooth(progress); // Expands as contours draw

          ctx.save();
          // Create radial clip mask around Elaina's face/hair (1310, 320) so outer room is pitch black!
          const rGrad = ctx.createRadialGradient(1310, 320, 40, 1310, 320, maskRadius);
          rGrad.addColorStop(0, `rgba(255, 255, 255, ${imgAlpha.toFixed(2)})`);
          rGrad.addColorStop(0.7, `rgba(255, 255, 255, ${(imgAlpha * 0.6).toFixed(2)})`);
          rGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');

          // Draw still image clipped
          ctx.globalAlpha = imgAlpha;
          ctx.drawImage(still, 0, 0, 1920, 1080);

          // Darken edges around Elaina so only she emerges from the blackness
          ctx.globalCompositeOperation = 'destination-in';
          ctx.fillStyle = rGrad;
          ctx.fillRect(0, 0, 1920, 1080);
          ctx.restore();
        } else {
          // Video playback starting at 0.7s so eyes open right around 4.5s!
          const vidT = 0.7 + ((t - 3200) / 1000);
          await new Promise(r => {
            if (Math.abs(video.currentTime - vidT) < 0.04) return r();
            video.onseeked = () => r();
            video.currentTime = Math.min(vidT, video.duration - 0.1);
          });
          const vidAlpha = Math.min(1.0, (t - 3200) / 400);
          ctx.save();
          ctx.globalAlpha = vidAlpha;
          ctx.drawImage(video, 0, 0, 1920, 1080);
          ctx.restore();
        }

        // Draw Neon Contours (0s to 3.8s) - Sáng đèn & Rõ nét
        if (t < 3800) {
          const contourAlpha = t < 3200 ? 1.0 : Math.max(0, 1.0 - (t - 3200) / 600);
          const drawProgress = clamp(t / 3200);
          const targetLength = drawProgress * totalContourLength;

          // Pass 0: Soft Neon Aura Glow (Illuminates like glowing neon lamps "sáng đèn")
          ctx.save();
          ctx.strokeStyle = contourGradient;
          ctx.shadowColor = '#38bdf8';
          ctx.shadowBlur = 14;
          ctx.globalAlpha = contourAlpha * 0.50;
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';

          let acc0 = 0;
          for (const p of preparedPaths) {
            if (acc0 >= targetLength) break;
            ctx.lineWidth = p.isMain ? 3.8 : 2.2;
            const rem = targetLength - acc0;
            if (rem >= p.total) {
              ctx.setLineDash([]);
              ctx.stroke(p.path2d);
              acc0 += p.total;
            } else {
              ctx.setLineDash([rem, p.total]);
              ctx.stroke(p.path2d);
              acc0 += rem;
              break;
            }
          }
          ctx.restore();

          // Pass 1: Neon Chromatic Stroke (Vibrant & saturated neon tube body)
          ctx.save();
          ctx.strokeStyle = contourGradient;
          ctx.shadowColor = '#c084fc';
          ctx.shadowBlur = 5;
          ctx.globalAlpha = contourAlpha * 0.95;
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';

          let acc1 = 0;
          for (const p of preparedPaths) {
            if (acc1 >= targetLength) break;
            ctx.lineWidth = p.isMain ? 1.8 : 1.1;
            const rem = targetLength - acc1;
            if (rem >= p.total) {
              ctx.setLineDash([]);
              ctx.stroke(p.path2d);
              acc1 += p.total;
            } else {
              ctx.setLineDash([rem, p.total]);
              ctx.stroke(p.path2d);
              acc1 += rem;
              break;
            }
          }
          ctx.restore();

          // Pass 2: Laser White Filament Core ("rõ nét hơn", crisp laser center)
          ctx.save();
          ctx.strokeStyle = '#ffffff';
          ctx.globalAlpha = contourAlpha * 0.95;
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';

          let acc2 = 0;
          for (const p of preparedPaths) {
            if (acc2 >= targetLength) break;
            ctx.lineWidth = p.isMain ? 0.80 : 0.45;
            const rem = targetLength - acc2;
            if (rem >= p.total) {
              ctx.setLineDash([]);
              ctx.stroke(p.path2d);
              acc2 += p.total;
            } else {
              ctx.setLineDash([rem, p.total]);
              ctx.stroke(p.path2d);
              acc2 += rem;
              break;
            }
          }
          ctx.restore();
        }

        ctx.restore(); // end camera zoom transform

        // ----------------------------------------------------
        // 2. ORBITAL RINGS & SHOOTING STARS
        // ----------------------------------------------------
        // Orbital Rings (Around Elaina)
        if (t >= 600 && t <= 11500) {
          const orbAlpha = t < 1600 ? (t - 600) / 1000 : t > 10500 ? Math.max(0, 1 - (t - 10500) / 1000) : 1.0;
          ctx.save();
          ctx.globalAlpha = orbAlpha * 0.55;

          // Ring 1 (Cyan)
          ctx.save();
          ctx.translate(1310, 340);
          ctx.rotate(-0.35 + t * 0.00015);
          ctx.strokeStyle = 'rgba(56, 189, 248, 0.45)';
          ctx.lineWidth = 1.1;
          ctx.beginPath();
          ctx.ellipse(0, 0, 360, 160, 0, 0, Math.PI * 2);
          ctx.stroke();

          // Satellite bead
          const bAngle = t * 0.0012;
          const bx = 360 * Math.cos(bAngle);
          const by = 160 * Math.sin(bAngle);
          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.arc(bx, by, 2.5, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();

          // Ring 2 (Violet)
          ctx.save();
          ctx.translate(1310, 340);
          ctx.rotate(0.50 - t * 0.00018);
          ctx.strokeStyle = 'rgba(192, 132, 252, 0.40)';
          ctx.lineWidth = 1.0;
          ctx.beginPath();
          ctx.ellipse(0, 0, 320, 140, 0, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();

          ctx.restore();
        }

        // Shooting Stars (Horizontal / diagonal realistic trails)
        for (const m of METEORS) {
          if (t >= m.startT && t <= m.startT + m.dur) {
            const p = (t - m.startT) / m.dur;
            const curX = m.x0 + m.dx * p;
            const curY = m.y + m.dy * p;
            const headAlpha = Math.sin(p * Math.PI);

            ctx.save();
            ctx.globalAlpha = headAlpha * 0.85;

            const trailGrad = ctx.createLinearGradient(curX, curY, curX - m.dx * 0.18, curY - m.dy * 0.18);
            trailGrad.addColorStop(0, '#ffffff');
            trailGrad.addColorStop(0.3, m.color);
            trailGrad.addColorStop(1, 'rgba(0,0,0,0)');

            ctx.strokeStyle = trailGrad;
            ctx.lineWidth = 2.0;
            ctx.beginPath();
            ctx.moveTo(curX, curY);
            ctx.lineTo(curX - m.dx * 0.18, curY - m.dy * 0.18);
            ctx.stroke();

            // Head flare
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(curX, curY, 2.0, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
          }
        }

        // ----------------------------------------------------
        // 3. CYBERPUNK TERMINAL CODE STREAM (Left Column)
        // ----------------------------------------------------
        const codeAlpha = t < 12000 ? 1.0 : Math.max(0, 1.0 - (t - 12000) / 600);
        if (codeAlpha > 0) {
          ctx.save();
          ctx.globalAlpha = codeAlpha;

          // Header
          ctx.font = '700 12px "JetBrains Mono", Consolas, monospace';
          ctx.fillStyle = 'rgba(56, 189, 248, 0.95)';
          ctx.fillText('TERMINAL // NEURAL MATRIX', 75, 58);

          // Typing speed: 195 chars/sec so all lines flow smoothly down the entire screen!
          const totalCharsPerSec = 195;
          const typedChars = Math.floor((t / 1000) * totalCharsPerSec);

          let charAcc = 0;
          let activeLineIdx = 0;
          let activeCharInLine = 0;

          for (let i = 0; i < CODE_LINES.length; i++) {
            const len = CODE_LINES[i].text.length;
            if (charAcc + len >= typedChars) {
              activeLineIdx = i;
              activeCharInLine = typedChars - charAcc;
              break;
            }
            charAcc += len;
            if (i === CODE_LINES.length - 1) {
              activeLineIdx = i;
              activeCharInLine = len;
            }
          }

          // Full vertical code layout down the screen (larger 15.5px font, 28px line height)
          const lineHeight = 28;
          // Smooth continuous downward cascading flow ("dạng chạy dọc xuống")
          let scrollY = 0;
          if (activeLineIdx > 14) {
            const currentLineTotal = Math.max(1, CODE_LINES[activeLineIdx].text.length);
            const lineProgress = activeCharInLine / currentLineTotal;
            scrollY = (activeLineIdx - 14 + lineProgress) * lineHeight;
          }

          ctx.save();
          ctx.beginPath();
          // Expanded horizontally to 840px and full vertical height
          ctx.rect(55, 65, 840, 970);
          ctx.clip();
          ctx.translate(0, -scrollY);

          ctx.font = '15.5px "JetBrains Mono", Consolas, monospace';

          for (let i = 0; i <= activeLineIdx; i++) {
            const line = CODE_LINES[i];
            const y = 92 + i * lineHeight;
            if (y - scrollY < 40 || y - scrollY > 1060) continue;

            const isCurrent = (i === activeLineIdx);
            const charsToShow = isCurrent ? activeCharInLine : line.text.length;

            if (line.type === 'comment') {
              ctx.fillStyle = '#64748b';
              ctx.fillText(line.text.slice(0, charsToShow), 75, y);
            } else {
              let curX = 75;
              let rem = charsToShow;
              for (const tok of line.tokens) {
                if (rem <= 0) break;
                const chunk = tok.v.slice(0, rem);
                rem -= chunk.length;

                if (tok.t === 'keyword') ctx.fillStyle = '#f472b6';
                else if (tok.t === 'fn') ctx.fillStyle = '#38bdf8';
                else if (tok.t === 'string') ctx.fillStyle = '#facc15';
                else if (tok.t === 'number') ctx.fillStyle = '#c084fc';
                else if (tok.t === 'prop') ctx.fillStyle = '#a5b4fc';
                else if (tok.t === 'op') ctx.fillStyle = '#94a3b8';
                else if (tok.t === 'comment') ctx.fillStyle = '#64748b';
                else ctx.fillStyle = '#e2e8f0';

                ctx.fillText(chunk, curX, y);
                curX += ctx.measureText(chunk).width;
              }
            }

            // Blinking cursor
            if (isCurrent && Math.floor(t / 200) % 2 === 0) {
              const fullWidth = ctx.measureText(line.text.slice(0, charsToShow)).width;
              ctx.fillStyle = '#38bdf8';
              ctx.fillRect(75 + fullWidth + 4, y - 13, 8, 17);
            }
          }
          ctx.restore();
          ctx.restore();
        }

        // ----------------------------------------------------
        // 4. HUD STATUS BAR & TIMECODE (Authentic Antigravity HUD)
        // ----------------------------------------------------
        // Top right timecode
        const sec = Math.floor(t / 1000);
        const cs = Math.floor((t % 1000) / 10);
        const tcStr = `00:${String(sec).padStart(2, '0')}:${String(cs).padStart(2, '0')}`;
        ctx.save();
        ctx.font = '11px "JetBrains Mono", Consolas, monospace';
        ctx.fillStyle = 'rgba(148, 163, 184, 0.7)';
        ctx.fillText(tcStr, 1780, 75);

        // Top left title
        ctx.fillStyle = 'rgba(56, 189, 248, 0.9)';
        ctx.fillText('ANTIGRAVITY // NEURAL AWAKENING', 75, 40);

        // Bottom right progress bar
        const progressPct = clamp(t / 12200);
        const pctStr = (progressPct * 100).toFixed(2) + '%';
        ctx.font = '700 11px "JetBrains Mono", Consolas, monospace';
        ctx.fillStyle = 'rgba(56, 189, 248, 0.9)';
        ctx.fillText('SYNC MATRIX', 1600, 1010);
        ctx.fillStyle = '#ffffff';
        ctx.fillText(pctStr, 1820, 1010);

        // Progress line
        ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
        ctx.fillRect(1600, 1022, 260, 3);
        const barGrad = ctx.createLinearGradient(1600, 0, 1860, 0);
        barGrad.addColorStop(0, '#38bdf8');
        barGrad.addColorStop(1, '#c084fc');
        ctx.fillStyle = barGrad;
        ctx.fillRect(1600, 1022, 260 * progressPct, 3);

        // Status text under progress bar
        let statusText = 'INITIALIZING NEURAL LINK';
        if (t >= 2000 && t < 3500) statusText = 'PHOTON MATRIX CALIBRATION';
        else if (t >= 3500 && t < 7000) statusText = 'RECONSTRUCTING TOPOLOGY';
        else if (t >= 7000 && t < 11800) statusText = 'SYNCHRONIZING CONSCIOUSNESS';
        else if (t >= 11800) statusText = 'SYSTEM ONLINE // AWAKENING COMPLETE';

        ctx.font = '9.5px "JetBrains Mono", Consolas, monospace';
        ctx.fillStyle = 'rgba(148, 163, 184, 0.6)';
        ctx.fillText(statusText, 1600, 1042);
        ctx.restore();

        // ----------------------------------------------------
        // 5. SHUTTER & FLASH TRANSITION (12.2s to 13.5s)
        // ----------------------------------------------------
        if (t >= 12200) {
          const sProg = clamp((t - 12200) / 800);
          // Shutter horizontal lines closing
          const h = 540 * smooth(sProg);
          ctx.fillStyle = '#0c0e14';
          ctx.fillRect(0, 0, 1920, h);
          ctx.fillRect(0, 1080 - h, 1920, h);

          // Center bright photon beam
          const beamAlpha = 1.0 - smooth(clamp((t - 12800) / 600));
          ctx.strokeStyle = `rgba(56, 189, 248, ${beamAlpha.toFixed(2)})`;
          ctx.lineWidth = 2.5;
          ctx.shadowColor = '#38bdf8';
          ctx.shadowBlur = 15;
          ctx.beginPath();
          ctx.moveTo(0, 540);
          ctx.lineTo(1920, 540);
          ctx.stroke();

          // Flash
          if (t >= 12600 && t <= 13400) {
            const fAlpha = Math.sin(((t - 12600) / 800) * Math.PI) * 0.75;
            ctx.fillStyle = `rgba(255, 255, 255, ${fAlpha.toFixed(2)})`;
            ctx.fillRect(0, 0, 1920, 1080);
          }
        }
      }

      // Export frame by frame
      const TOTAL_FRAMES = 810; // 13.5s at 60fps
      statusEl.textContent = 'Starting export (0/810)...';

      for (let f = 0; f < TOTAL_FRAMES; f++) {
        const t = f * (13500 / TOTAL_FRAMES);
        await drawFrame(t);

        const blob = await new Promise(res => canvas.toBlob(res, 'image/jpeg', 0.96));
        const resp = await fetch('/submit-frame?f=' + f, {
          method: 'POST',
          body: blob
        });
        if (!resp.ok) {
          throw new Error('Server returned ' + resp.status);
        }

        if (f % 30 === 0) {
          statusEl.textContent = `Exporting frame ${f}/${TOTAL_FRAMES} (${((f/TOTAL_FRAMES)*100).toFixed(1)}%)...`;
        }
      }

      statusEl.textContent = 'All 810 frames exported successfully!';
      await fetch('/done', { method: 'POST' });
    })().catch(err => {
      console.error(err);
      document.getElementById('status').textContent = 'ERROR: ' + err.message;
      fetch('/error', { method: 'POST', body: err.message });
    });
  </script>
</body>
</html>
