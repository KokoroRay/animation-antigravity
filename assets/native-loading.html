<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Elaina</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }
    body {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      -webkit-app-region: drag;
      -webkit-user-select: none;
      user-select: none;
      color: #e2e8f0;
      font-family: Consolas, "Segoe UI", sans-serif;
      background: radial-gradient(ellipse at 50% 47%, rgba(22, 33, 63, .28), transparent 34%), #000;
    }
    .halo {
      position: absolute;
      left: 50%;
      top: 45%;
      width: min(42vmin, 420px);
      aspect-ratio: 1;
      border: 1px solid rgba(56, 189, 248, .14);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 50px rgba(56, 189, 248, .07), inset 0 0 50px rgba(192, 132, 252, .06);
      animation: halo 3.8s ease-in-out infinite;
    }
    .halo::before, .halo::after {
      content: "";
      position: absolute;
      inset: 9%;
      border: 1px solid rgba(192, 132, 252, .15);
      border-radius: 50%;
      animation: orbit 18s linear infinite;
    }
    .halo::after {
      inset: 19%;
      border-color: rgba(56, 189, 248, .12);
      animation-direction: reverse;
      animation-duration: 24s;
    }
    .spark {
      position: absolute;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: #7dd3fc;
      box-shadow: 0 0 10px 2px rgba(56, 189, 248, .7);
      animation: drift 3s ease-in-out infinite alternate;
    }
    .spark.one { left: 32%; top: 34%; }
    .spark.two { right: 32%; top: 50%; animation-delay: -1.2s; }
    .spark.three { left: 39%; bottom: 34%; animation-delay: -.7s; }
    img {
      position: relative;
      z-index: 1;
      display: block;
      width: min(19vmin, 180px);
      height: min(28vmin, 250px);
      object-fit: contain;
      background: transparent;
      filter: drop-shadow(0 0 18px rgba(167, 139, 250, .26));
      animation: character 3.2s ease-in-out infinite;
    }
    .title {
      position: relative;
      z-index: 1;
      margin-top: 17px;
      color: #7dd3fc;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 3px;
      text-align: center;
      text-shadow: 0 0 14px rgba(56, 189, 248, .55);
    }
    .subtitle {
      position: relative;
      z-index: 1;
      margin-top: 9px;
      color: rgba(148, 163, 184, .68);
      font-size: 9px;
      letter-spacing: 2px;
      text-align: center;
    }
    .progress {
      position: relative;
      z-index: 1;
      width: 150px;
      height: 2px;
      margin-top: 18px;
      overflow: hidden;
      border-radius: 2px;
      background: rgba(148, 163, 184, .15);
    }
    .progress::after {
      content: "";
      position: absolute;
      inset: 0 auto 0 -40%;
      width: 40%;
      background: linear-gradient(90deg, transparent, #38bdf8, #c084fc, transparent);
      animation: progress 1.8s ease-in-out infinite;
    }
    @keyframes halo { 50% { opacity: .55; transform: translate(-50%, -50%) scale(1.06); } }
    @keyframes orbit { to { transform: rotate(360deg); } }
    @keyframes drift { to { opacity: .25; transform: translate3d(0, -12px, 0) scale(.7); } }
    @keyframes character { 50% { transform: translateY(-5px); } }
    @keyframes progress { to { transform: translateX(350%); } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 12s !important; }
    }
  </style>
</head>
<body>
  <div class="halo" aria-hidden="true"></div>
  <span class="spark one" aria-hidden="true"></span>
  <span class="spark two" aria-hidden="true"></span>
  <span class="spark three" aria-hidden="true"></span>
  <img src="elaina-evernight.gif" alt="Elaina">
  <div class="title">INITIALIZING NEURAL AWAKENING...</div>
  <div class="progress" aria-hidden="true"></div>
</body>
</html>
